<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>농산물 경매가</title>
<style>
:root{--bg:#fff;--fg:#111;--card:#f1f4ef;--ac:#1b5e20;--mu:#555}
@media(prefers-color-scheme:dark){:root{--bg:#121412;--fg:#f2f2f2;--card:#1e221d;--ac:#81c784;--mu:#b0b5b0}}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:var(--bg);color:var(--fg);font:1rem/1.45 system-ui,sans-serif}
h1{font-size:1.3rem;margin:.6em 0}
input,select,button{width:100%;padding:.7em;margin:.25em 0;font-size:1rem;border-radius:.5em;border:1px solid var(--mu);background:var(--bg);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0;font-weight:700}
button.g{background:var(--card);color:var(--fg)}
.fx{display:flex;gap:.4em}.fx>*{flex:1}
.box{background:var(--card);border-radius:.6em;padding:.5em .8em;margin:.5em 0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:.5em;flex-wrap:wrap}
button.sm{width:auto;margin:0;padding:.3em .7em;font-size:.8rem;font-weight:400;background:var(--card);color:var(--mu);border:1px solid var(--mu)}
label{font-size:.85rem;color:var(--mu);display:block;margin-top:.4em}
.row{background:var(--card);border-radius:.6em;padding:.6em .8em;margin:.4em 0}
.nm{font-size:1.15rem;font-weight:700}.pr{font-size:1.5rem;font-weight:800;color:var(--ac)}
.row small{color:var(--mu);display:block;font-size:.85rem}
#msg{color:var(--mu);margin:.4em 0}
#sum{background:var(--card);border-radius:.6em;padding:.5em .8em;margin:.4em 0;display:none}
</style></head><body>
<div class="hd"><h1>🥬 농산물 경매가</h1><button class="sm" onclick="tog()">⚙ 설정</button></div>
<div class="fx"><button class="g" onclick="fs(-1)">글씨 작게</button><button class="g" onclick="fs(1)">글씨 크게</button></div>
<div id="fav"></div>
<div id="cfg" class="box" hidden><b>API 설정</b>
<input id="url" placeholder="API 주소">
<input id="kp" placeholder="키 파라미터명">
<input id="key" type="password" placeholder="인증키 (디코딩)">
<input id="ps" inputmode="numeric" placeholder="페이지 크기 (기본 1000)">
<button onclick="save();$('#msg').textContent='저장됨';$('#cfg').hidden=true">저장</button>
</div>
<label>경매(정산) 일자</label><input id="dt" type="date">
<div class="fx"><button class="g" onclick="setD(0)">오늘</button><button class="g" onclick="setD(-1)">어제</button></div>
<label>도매시장 코드</label><input id="mk" inputmode="numeric" placeholder="숫자 코드" oninput="mkName=''">
<button class="g" onclick="findMk()">시장 코드 찾기</button>
<div id="chips"></div>
<label>품목 직접 입력 (비우면 전체)</label><input id="q" placeholder="예: 배추" oninput="typ()">
<button onclick="load()">전체 불러오기</button>
<label>품목 선택 (불러온 뒤 목록이 나옵니다)</label><select id="it" onchange="pick()"><option value="">전체 품목</option></select>
<button class="g" onclick="addF()">⭐ 이 시장·품목을 즐겨찾기에 저장</button>
<select id="so" onchange="draw()"><option value="t">시간순</option><option value="d">가격 높은순</option><option value="a">가격 낮은순</option></select>
<div id="msg"></div><div id="sum"></div><div id="list"></div>
<script>
const $=s=>document.querySelector(s),ids=['url','kp','key','ps','mk','q'],SZ=[16,19,22,26,30,34];
const D={url:'https://apis.data.go.kr/B552845/katRealTime2/trades2',kp:'serviceKey',ps:'1000'};
let C={},rows=[],F=[],mkName='',si=2,ex=false;
try{C=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){}
try{F=JSON.parse(localStorage.getItem('fav')||'[]')}catch(e){}
try{si=+localStorage.getItem('fs')||2}catch(e){}
ids.forEach(i=>$('#'+i).value=C[i]||D[i]||'');
function fs(d){si=Math.max(0,Math.min(SZ.length-1,si+d));document.documentElement.style.fontSize=SZ[si]+'px';try{localStorage.setItem('fs',si)}catch(e){}}
fs(0);
function tog(){$('#cfg').hidden=!$('#cfg').hidden}
function setD(n){const t=new Date();t.setDate(t.getDate()+n);t.setMinutes(t.getMinutes()-t.getTimezoneOffset());$('#dt').value=t.toISOString().slice(0,10)}
setD(0);
function save(){try{localStorage.setItem('cfg',JSON.stringify(Object.fromEntries(ids.map(i=>[i,$('#'+i).value.trim()]))))}catch(e){}}
function sf(){try{localStorage.setItem('fav',JSON.stringify(F))}catch(e){}}
function drawF(){$('#fav').innerHTML=F.length?'<label>⭐ 즐겨찾기 (누르면 바로 조회)</label>'+F.map((f,i)=>`<div class="fx"><button style="flex:5" onclick="useF(${i})">${esc(f.mn||f.mk)}${f.q?' · '+esc(f.q):' · 전체'}</button><button class="g" style="flex:1" onclick="delF(${i})">✕</button></div>`).join(''):''}
function addF(){const mk=$('#mk').value.trim(),q=$('#q').value.trim();
if(!mk){$('#msg').textContent='도매시장 코드를 먼저 입력하세요';return}
if(F.some(f=>f.mk===mk&&f.q===q)){$('#msg').textContent='이미 저장되어 있습니다';return}
F.push({mk,mn:mkName||(rows[0]&&rows[0].whsl_mrkt_nm)||'',q});sf();drawF();$('#msg').textContent='즐겨찾기에 저장했습니다'}
function delF(i){if(confirm('즐겨찾기를 삭제할까요?')){F.splice(i,1);sf();drawF()}}
function useF(i){const f=F[i];ex=false;$('#mk').value=f.mk;$('#q').value=f.q;mkName=f.mn;load()}
drawF();
function pick(){const v=$('#it').value;$('#q').value=v;ex=!!v;draw()}
function typ(){ex=false;const q=$('#q').value.trim();$('#it').value=[...$('#it').options].some(o=>o.value===q)?q:'';draw()}
function fillIt(){const m=new Map();rows.forEach(o=>{const k=o.corp_gds_item_nm;if(k)m.set(k,(m.get(k)||0)+1)});
const l=[...m].sort((a,b)=>a[0].localeCompare(b[0],'ko'));
$('#it').innerHTML='<option value="">전체 품목 ('+m.size+'종)</option>'+l.map(([k,n])=>`<option value="${esc(k)}">${esc(k)} (${n}건)</option>`).join('');
const q=$('#q').value.trim();$('#it').value=m.has(q)?q:''}
const enc=k=>encodeURIComponent('cond['+k+'::EQ]');
const num=v=>parseFloat(String(v??'').replace(/[^\d.-]/g,''))||0;
const won=v=>num(v)?Math.round(num(v)).toLocaleString('ko-KR')+'원':'-';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function find(o,k){if(o&&typeof o==='object'){if(k in o)return o[k];for(const v of Object.values(o)){const r=find(v,k);if(r!==undefined)return r}}}
function arr(o){if(Array.isArray(o))return o;if(o&&typeof o==='object'){for(const v of Object.values(o)){const r=arr(v);if(r)return r}}return null}
async function page(p,n,extra){
const u=$('#url').value.trim(),k=$('#key').value.trim();
const q=[($('#kp').value.trim()||'serviceKey')+'='+encodeURIComponent(k),'returnType=JSON','pageNo='+p,'numOfRows='+n,enc('trd_clcln_ymd')+'='+$('#dt').value,...extra];
const r=await fetch(u+(u.includes('?')?'&':'?')+q.join('&'));
let j;try{j=JSON.parse(await r.text())}catch(e){throw new Error('JSON이 아닌 응답입니다')}
const e=find(j,'returnAuthMsg');if(e)throw new Error(e+' (코드 '+find(j,'returnReasonCode')+')');
const rc=String(find(j,'resultCode')??''),rm=String(find(j,'resultMsg')??'');
if(rc&&!/^0+$/.test(rc)&&!/정상|NORMAL|^OK$/i.test(rm))throw new Error((rm||'오류')+' (코드 '+rc+')');
return{rows:arr(j)||[],total:+find(j,'totalCount')||0}}
function need(){if(!$('#key').value.trim()){$('#msg').textContent='API 설정에서 인증키를 입력하세요';$('#cfg').hidden=false;return false}return true}
async function load(){
save();if(!need())return;
const mk=$('#mk').value.trim();
if(!mk){$('#msg').textContent='도매시장 코드를 입력하세요 (시장 코드 찾기 버튼 사용 가능)';return}
const n=+$('#ps').value||1000;rows=[];fillIt();$('#list').innerHTML='';$('#sum').style.display='none';
try{for(let p=1;p<=80;p++){
const r=await page(p,n,[enc('whsl_mrkt_cd')+'='+encodeURIComponent(mk)]);
rows.push(...r.rows);$('#msg').textContent='불러오는 중… '+rows.length+'/'+r.total+'건';
if(!r.rows.length||rows.length>=r.total)break}
if(rows[0]&&rows[0].whsl_mrkt_nm)mkName=rows[0].whsl_mrkt_nm;
fillIt();draw()}catch(e){$('#msg').textContent='실패: '+e.message;draw()}}
async function findMk(){
save();if(!need())return;const m=new Map();
try{for(let p=1;p<=3;p++){const r=await page(p,1000,[]);r.rows.forEach(o=>m.set(o.whsl_mrkt_cd,o.whsl_mrkt_nm));$('#msg').textContent='시장 찾는 중… '+m.size+'곳';if(!r.rows.length)break}
$('#chips').innerHTML=[...m].map(([c,nm])=>`<button class="g" onclick="$('#mk').value='${esc(c)}';mkName='${esc(nm)}';$('#chips').innerHTML=''">${esc(nm)} (${esc(c)})</button>`).join('');
$('#msg').textContent=m.size+'곳 발견 (일부 시장만 보일 수 있음). 눌러서 선택하세요'}
catch(e){$('#msg').textContent='실패: '+e.message}}
function draw(){
const q=$('#q').value.trim(),so=$('#so').value,P=o=>num(o.scsbd_prc);
const r=rows.filter(o=>!q||(ex?o.corp_gds_item_nm===q:[o.corp_gds_item_nm,o.corp_gds_vrty_nm,o.gds_sclsf_nm,o.gds_mclsf_nm].some(v=>v&&String(v).includes(q))));
if(so==='d')r.sort((a,b)=>P(b)-P(a));else if(so==='a')r.sort((a,b)=>P(a)-P(b));else r.sort((a,b)=>String(a.scsbd_dt).localeCompare(String(b.scsbd_dt)));
const pr=r.map(P).filter(x=>x>0),s=$('#sum'),m=$('#msg'),bad=m.textContent.startsWith('실패');
if(pr.length){s.style.display='block';s.innerHTML=`<b>${r.length}건</b> · 최저 ${won(Math.min(...pr))} · 평균 ${won(pr.reduce((a,b)=>a+b,0)/pr.length)} · 최고 ${won(Math.max(...pr))}`}else s.style.display='none';
if(rows.length&&!bad)m.textContent='전체 '+rows.length+'건 중 '+r.length+'건 (화면에는 최대 500건)';
if(!rows.length&&!bad)m.textContent='0건입니다. 날짜(어제 버튼)나 시장 코드를 확인하세요';
$('#list').innerHTML=r.slice(0,500).map(o=>{const v=o.corp_gds_vrty_nm&&o.corp_gds_vrty_nm!==o.corp_gds_item_nm?' ('+esc(o.corp_gds_vrty_nm)+')':'';
return`<div class="row"><div class="nm">${esc(o.corp_gds_item_nm)}${v}</div><div class="pr">${won(o.scsbd_prc)}</div><small>${esc(o.unit_qty)}${esc(o.unit_nm)} · ${esc(o.pkg_nm)} · 수량 ${esc(o.qty)}</small><small>${esc(o.whsl_mrkt_nm)} · ${esc(o.corp_nm)} · ${esc(o.plor_nm)} · ${esc(o.scsbd_dt)}</small></div>`}).join('')}
</script></body></html>
