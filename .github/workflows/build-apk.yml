name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www && cp index.html www/index.html
          cat > capacitor.config.json <<'EOF'
          {"appId":"app.farmprice","appName":"농산물경매","webDir":"www","plugins":{"CapacitorHttp":{"enabled":true}}}
          EOF
          npx cap add android
          npx cap sync android
      - name: Set app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          res = 'android/app/src/main/res'
          full = Image.open('icon.png').convert('RGBA')
          fg = Image.open('icon-fg.png').convert('RGBA')
          for d, k in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              os.makedirs(f'{res}/mipmap-{d}', exist_ok=True)
              s, f = int(48 * k), int(108 * k)
              sq = full.resize((s, s), Image.LANCZOS)
              sq.save(f'{res}/mipmap-{d}/ic_launcher.png')
              m = Image.new('L', (s * 4, s * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, s * 4 - 1, s * 4 - 1), fill=255)
              r = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              r.paste(sq, (0, 0), m.resize((s, s), Image.LANCZOS))
              r.save(f'{res}/mipmap-{d}/ic_launcher_round.png')
              fg.resize((f, f), Image.LANCZOS).save(f'{res}/mipmap-{d}/ic_launcher_foreground.png')
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          x = ('<?xml version="1.0" encoding="utf-8"?>\n'
               '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
               '<background android:drawable="@color/ic_launcher_background"/>\n'
               '<foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
               '</adaptive-icon>\n')
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(f'{res}/mipmap-anydpi-v26/{n}.xml', 'w').write(x)
          os.makedirs(f'{res}/values', exist_ok=True)
          open(f'{res}/values/ic_launcher_background.xml', 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '<color name="ic_launcher_background">#2E7D32</color>\n</resources>\n')
          print('icons done')
          PY
      - name: Use fixed debug key
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
          fi
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: farm-price-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
